name: build-scholars-library

on:
  push:
    branches: [ main ]
    paths:
      - 'scholars-library/**'
      - '.github/workflows/build-scholars.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: scholars-library

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create --platforms=android --org com.scholars --project-name scholars_library .
          rm -rf test

      - name: App name and permissions
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'android:label="[^"]*"', 'android:label="مكتبة العلماء"', s, count=1)
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          open(p, 'w', encoding='utf-8').write(s)
          PY

      - run: flutter pub get

      - name: Disable Android lint checks
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/nolint.gradle <<'GRADLE'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital') || t.name.startsWith('lintAnalyze')) {
                t.enabled = false
              }
            }
          }
          GRADLE

      - run: flutter analyze lib
        continue-on-error: true

      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: scholars-library-apk
          path: scholars-library/build/app/outputs/flutter-apk/*.apk
