name: probe-turath
on:
  push:
    paths: ['probe/**']
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe sizes and indexing
        run: |
          set +e
          for id in 12293 9260 7339 11166 11224 31341; do
            echo "== $id"; curl -s -D - -o /tmp/b$id.json "https://files.turath.io/books-v3/$id.json" | grep -iE "HTTP|content-length|content-encoding|access-control"; ls -la /tmp/b$id.json
          done
          echo "== gz test"; curl -s -H "Accept-Encoding: gzip" -D - -o /dev/null "https://files.turath.io/books-v3/12293.json" | grep -iE "content-encoding|content-length"
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/b12293.json'))
          print('top keys', [k for k in d.keys()])
          pages=d['pages']
          print('pages', len(pages))
          i=4101
          print(i, {k:(str(v)[:120]) for k,v in pages[i].items()})
          print(i-1, pages[i-1].get('vol'), pages[i-1].get('page'))
          print(i+1, pages[i+1].get('vol'), pages[i+1].get('page'))
          print('first', {k:(str(v)[:80]) for k,v in pages[0].items()})
          print('has_html', '<span' in pages[i]['text'])
          d2=json.load(open('/tmp/b11224.json'))
          print('small page_id5 ->', d2['pages'][4].get('vol'), d2['pages'][4].get('page'))
          print([k for k in d2.keys()])
          m=d2.get('meta') or {}
          print('meta keys', list(m.keys()) if isinstance(m,dict) else type(m))
          idx=d2.get('indexes')
          print('indexes keys', list(idx.keys()) if isinstance(idx,dict) else type(idx))
          print('page_map sample', {k:(str(v)[:60]) for k,v in list((idx.get('page_map') or {}).items())[:3]} if isinstance(idx,dict) else '')
          print('headings sample', (idx.get('headings') or [])[:3] if isinstance(idx,dict) else '')
          PY
