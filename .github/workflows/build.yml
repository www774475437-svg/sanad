name: build-sanad

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Arrange files
        run: |
          mkdir -p lib
          if [ -f main.dart ]; then mv -f main.dart lib/main.dart; fi
          ls -R lib

      - name: Create Android project
        run: |
          flutter create --platforms=android --org com.alathari --project-name sanad .
          rm -rf test

      - name: App name and permissions
        run: |
          python3 - <<'PY'
          import re
          p = 'android/app/src/main/AndroidManifest.xml'
          s = open(p, encoding='utf-8').read()
          s = re.sub(r'android:label="[^"]*"', 'android:label="سند"', s, count=1)
          if 'android.permission.INTERNET' not in s:
              s = s.replace('<application', '<uses-permission android:name="android.permission.INTERNET"/>\n    <application', 1)
          if 'android.intent.action.VIEW' not in s:
              q = '<intent><action android:name="android.intent.action.VIEW"/><data android:scheme="https"/></intent>'
              if '<queries>' in s:
                  s = s.replace('<queries>', '<queries>\n        ' + q, 1)
              else:
                  s = s.replace('</manifest>', '    <queries>' + q + '</queries>\n</manifest>', 1)
          open(p, 'w', encoding='utf-8').write(s)
          print(s)
          PY

      - name: Fonts (Amiri)
        run: |
          mkdir -p assets/fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl/amiri
          if curl -fsSL -o assets/fonts/Amiri-Regular.ttf $B/Amiri-Regular.ttf && curl -fsSL -o assets/fonts/Amiri-Bold.ttf $B/Amiri-Bold.ttf; then
            cat >> pubspec.yaml <<'YAML'
            fonts:
              - family: Amiri
                fonts:
                  - asset: assets/fonts/Amiri-Regular.ttf
                  - asset: assets/fonts/Amiri-Bold.ttf
                    weight: 700
          YAML
            echo "fonts added"
          else
            echo "font download failed, continuing without"
          fi

      - run: flutter pub get

      - name: Disable Android lint checks
        run: |
          mkdir -p ~/.gradle/init.d
          cat > ~/.gradle/init.d/nolint.gradle <<'GRADLE'
          allprojects {
            tasks.configureEach { t ->
              if (t.name.startsWith('lintVital') || t.name.startsWith('lintAnalyze')) {
                t.enabled = false
              }
            }
          }
          GRADLE

      - run: flutter build apk --release --split-per-abi --dart-define=BUILD=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: sanad-apk
          path: build/app/outputs/flutter-apk/*.apk

      - name: Publish APK to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk sanad.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk sanad-old.apk
          gh release create "v1.0.${{ github.run_number }}" sanad.apk sanad-old.apk --title "سَنَد v1.0.${{ github.run_number }}" --notes "النسخة الأولى من تطبيق سند" --latest

  web:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create web project
        run: |
          mkdir -p lib
          if [ -f main.dart ]; then mv -f main.dart lib/main.dart; fi
          flutter create --platforms=web --org com.alathari --project-name sanad .
          rm -rf test
          python3 - <<'PY'
          p = 'web/index.html'
          s = open(p, encoding='utf-8').read()
          s = s.replace('<html>', '<html lang="ar" dir="rtl">', 1)
          import re
          s = re.sub(r'<title>[^<]*</title>', '<title>سَنَد</title>', s, count=1)
          meta = ('<meta property="og:title" content="سَنَد">'
                  '<meta property="og:description" content="كلام العلماء بنصّه ومصدره من كتبهم، دون فتوى من الذكاء الاصطناعي">'
                  '<meta property="og:type" content="website">'
                  '<meta name="theme-color" content="#0F5F57">')
          s = s.replace('</head>', meta + '</head>', 1)
          ov = open('tools/boot_overlay.html', encoding='utf-8').read()
          s = s.replace('<body>', '<body>' + ov, 1)
          open(p, 'w', encoding='utf-8').write(s)
          m = open('web/manifest.json', encoding='utf-8').read()
          m = re.sub(r'"name":\s*"[^"]*"', '"name": "سَنَد"', m, count=1)
          m = re.sub(r'"short_name":\s*"[^"]*"', '"short_name": "سند"', m, count=1)
          open('web/manifest.json', 'w', encoding='utf-8').write(m)
          PY

      - name: Fonts (Amiri)
        run: |
          mkdir -p assets/fonts
          B=https://raw.githubusercontent.com/google/fonts/main/ofl/amiri
          if curl -fsSL -o assets/fonts/Amiri-Regular.ttf $B/Amiri-Regular.ttf && curl -fsSL -o assets/fonts/Amiri-Bold.ttf $B/Amiri-Bold.ttf; then
            cat >> pubspec.yaml <<'YAML'
            fonts:
              - family: Amiri
                fonts:
                  - asset: assets/fonts/Amiri-Regular.ttf
                  - asset: assets/fonts/Amiri-Bold.ttf
                    weight: 700
          YAML
            echo "fonts added"
          else
            echo "font download failed, continuing without"
          fi

      - run: flutter pub get

      - name: Check turath CORS
        run: |
          curl -s -D - -o /dev/null -H "Origin: https://www774475437-svg.github.io" "https://api.turath.io/search?q=%D8%A7%D9%84%D9%86%D9%85%D8%B5&ver=3" | head -20 || true

      - name: Build search data
        run: python3 tools/build_data.py web/data

      - run: flutter build web --release --pwa-strategy=none --base-href /sanad/ --dart-define=BUILD=${{ github.run_number }}

      - name: Kill old service worker
        run: cp tools/kill_sw.js build/web/flutter_service_worker.js

      - name: Deploy to GitHub Pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages
          clean: true
          single-commit: true

      - name: Try to enable Pages
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/pages -f "source[branch]=gh-pages" -f "source[path]=/" || echo "enable manually"
